name: Build vehicle feeds

on:
  schedule:
    # 05:15 UTC — early morning in Brussels, before Meta and Google poll.
    - cron: '15 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'config.json'
      - '.github/workflows/build-feeds.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two builds publish at once, but let a running one finish so a
# scheduled feed is not left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Temporary. Job logs need admin rights to read, but step names and their
      # pass/fail show publicly, so each check below reports one specific thing.
      - name: "diag 1 - MOTORK_AB secret is set"
        continue-on-error: true
        env: { V: "${{ secrets.MOTORK_AB }}" }
        run: test -n "$V"
      - name: "diag 2 - MOTORK_WAASLAND secret is set"
        continue-on-error: true
        env: { V: "${{ secrets.MOTORK_WAASLAND }}" }
        run: test -n "$V"
      - name: "diag 3 - MOTORK_VANSPRINGEL secret is set"
        continue-on-error: true
        env: { V: "${{ secrets.MOTORK_VANSPRINGEL }}" }
        run: test -n "$V"
      - name: "diag 4 - MOTORK_NEYT secret is set"
        continue-on-error: true
        env: { V: "${{ secrets.MOTORK_NEYT }}" }
        run: test -n "$V"
      - name: "diag 5 - MOTORK_AB looks like a feed URL"
        continue-on-error: true
        env: { V: "${{ secrets.MOTORK_AB }}" }
        run: echo "$V" | grep -q '^https://stock-be\.motork\.io/myPortalXML'
      - name: "diag 6 - MotorK answers from GitHub's network"
        continue-on-error: true
        env: { V: "${{ secrets.MOTORK_AB }}" }
        run: curl -sSf --max-time 120 -o /tmp/ab.xml "$V"
      - name: "diag 7 - that response contains vehicles"
        continue-on-error: true
        run: grep -q '<car ' /tmp/ab.xml
      - name: "diag 8 - advusedcars.be reachable from GitHub"
        continue-on-error: true
        run: curl -sSf --max-time 60 -o /dev/null https://nl.advusedcars.be/autos/tweedehands/x/x/x/x/x/20991/

      - name: Build feeds
        run: node src/build.js
        env:
          MOTORK_AB: ${{ secrets.MOTORK_AB }}
          MOTORK_WAASLAND: ${{ secrets.MOTORK_WAASLAND }}
          MOTORK_VANSPRINGEL: ${{ secrets.MOTORK_VANSPRINGEL }}
          MOTORK_NEYT: ${{ secrets.MOTORK_NEYT }}

      - name: Check output against the Meta and Google specs
        run: node tools/check-output.js

      - name: Upload feeds as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feeds
          path: docs/
          retention-days: 14

      # enablement: true turns GitHub Pages on by itself the first time this runs,
      # so nobody has to find the setting in the repository menus.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
